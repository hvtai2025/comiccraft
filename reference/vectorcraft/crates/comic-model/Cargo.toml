[package]
name = "vectorcraft-comic-model"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ComicCraft project model: the bundle schema, stable comic ids, narrative entities and provenance (pure data + serde)"

[lints]
workspace = true

# Only what the code uses. A declared-but-unused dependency makes `cargo xtask layers` report an
# edge that does not exist, and it costs build time, so each dependency arrives with the module
# that needs it:
#   * vectorcraft-doc  — `NodeId`, taken from the engine rather than minted (schema §9)
#   * vectorcraft-geom — `Size` for `PageSize` and `Rect` for the artboard facts (§5.3, rule 15)
#   * thiserror        — the bundle reader/writer's error type (§14: only two load failures are fatal)
#   * sha2             — `content_hash` (§7.2). Not a workspace key: `crates/pdf` already depends
#                        on `sha2` directly, so this is the same version, not a new crate.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
vectorcraft-doc = { workspace = true }
vectorcraft-geom = { workspace = true }
thiserror = { workspace = true }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
