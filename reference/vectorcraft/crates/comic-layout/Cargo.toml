[package]
name = "vectorcraft-comic-layout"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ComicCraft layout: deterministic page and panel layout, lettering fitting, validation and publishing assembly"

[lints]
workspace = true

# Only what the code uses. A declared-but-unused dependency makes `cargo xtask layers` report
# an edge that does not exist, and it costs real build time — `render`, `pdf`, `svg` and `text`
# are heavy, and building them for this crate's tests before it calls them is pure waste. Each
# dependency arrives with the module that needs it:
#   * vectorcraft-comic-model — the entities a plan is built for (`Page`, `Panel`, `PageSize`,
#                               `ReadingDirection`) and the `Finding` the validator returns (M1)
#   * vectorcraft-doc         — `NodeId`, for resolving `Panel.frame_node_id` (M1)
#   * vectorcraft-geom        — `Rect`, the artboard rectangle as the model spells it (M1)
#   * thiserror               — the template and layout error types (M1, the panel tree; the
#                               lettering tree's `FitError` is hand-written)
#   * vectorcraft-text        — lettering fitting, via `layout_with` and `LayoutOptions` (M1, the
#                               lettering tree)
#   * vectorcraft-render, vectorcraft-pdf, vectorcraft-svg — publishing assembly (M7)
[dependencies]
serde = { workspace = true }
vectorcraft-comic-model = { workspace = true }
vectorcraft-doc = { workspace = true }
vectorcraft-geom = { workspace = true }
thiserror = { workspace = true }
vectorcraft-text = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
